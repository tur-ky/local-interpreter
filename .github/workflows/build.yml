name: build

# Builds the frozen app and the installer on a clean Windows runner.
#   * push a tag  v*  -> the installer is published as a GitHub Release asset
#   * run by hand     -> the installer is attached as a workflow artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 faster-whisper soundcard numpy pillow pyinstaller

      - name: Install the CUDA runtime libraries
        # LocalInterpreter.spec copies cuBLAS 12 and cuDNN 9 out of these wheels
        # and bundles them next to the executable. They are only needed to
        # *build*; the app never imports them from Python.
        run: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Freeze the app
        shell: pwsh
        run: .\build.ps1 -SkipInstaller

      - name: Verify the CUDA runtime was bundled
        # Without these the packaged app silently falls back to the CPU, which
        # is not something to find out after publishing a release.
        shell: pwsh
        run: |
          $needed = @(
            "cublas64_12.dll", "cublasLt64_12.dll", "cudnn64_9.dll",
            "cudnn_graph64_9.dll", "cudnn_ops64_9.dll", "cudnn_cnn64_9.dll",
            "cudnn_engines_precompiled64_9.dll"
          )
          $missing = $needed | Where-Object { -not (Test-Path "dist\LocalInterpreter\$_") }
          if ($missing) { throw "CUDA libraries missing from the build: $($missing -join ', ')" }
          "dist: {0:N0} MB, all CUDA libraries present" -f `
            ((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build the installer
        shell: pwsh
        run: .\build.ps1 -SkipApp

      - name: Report sizes
        shell: pwsh
        run: Get-ChildItem installer | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload the installer as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LocalInterpreter-installer
          path: installer/*.exe
          compression-level: 0
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = (Get-ChildItem installer\*.exe)[0]
          $existing = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if (-not $?) {
            gh release create $tag $asset.FullName --title "Local Interpreter $tag" --generate-notes
          } elseif ($existing -contains $asset.Name) {
            # A release built and verified by hand already has its installer
            # attached; never silently replace a tested binary.
            "release $tag already carries $($asset.Name) - leaving it untouched"
          } else {
            gh release upload $tag $asset.FullName
          }

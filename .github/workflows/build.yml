name: build

# Builds the frozen app and the installer on a clean Windows runner.
#   * push a tag  v*  -> the installer is published as a GitHub Release asset
#   * run by hand     -> the installer is attached as a workflow artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 faster-whisper soundcard numpy pillow pyinstaller

      - name: Install the CUDA runtime libraries
        # LocalInterpreter.spec copies cuBLAS 12 and cuDNN 9 out of these wheels
        # and bundles them next to the executable. They are only needed to
        # *build*; the app never imports them from Python.
        run: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Report sizes
        shell: pwsh
        run: |
          "dist: {0:N0} MB" -f ((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum/1MB)
          Get-ChildItem installer | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload the installer as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LocalInterpreter-installer
          path: installer/*.exe
          compression-level: 0
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = (Get-ChildItem installer\*.exe)[0].FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "Local Interpreter $tag" --generate-notes
          }
